<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <h3>Rock Paper Scissors</h3>
        
        <div class="score-board">
            <div class="score">
                <span id="user-score">0</span>
                <p>You</p>
            </div>
            <div class="score">
                <span id="comp-score">0</span>
                <p>Comp</p>
            </div>
        </div>

        <div class="battle-area">
            <div class="choice-view">
                <small>You Picked</small>
                <div id="user-picked" class="view-icon"><i class="fa-solid fa-question"></i></div>
            </div>
            <div class="versus">VS</div>
            <div class="choice-view">
                <small>Comp Picked</small>
                <div id="comp-picked" class="view-icon"><i class="fa-solid fa-question"></i></div>
            </div>
        </div>

        <div class="choices">
            <button class="choice" id="rock" aria-label="Rock">
                <i class="fa-solid fa-hand-fist"></i>
            </button>
            <button class="choice" id="paper" aria-label="Paper">
                <i class="fa-solid fa-hand"></i>
            </button>
            <button class="choice" id="scissors" aria-label="Scissors">
                <i class="fa-solid fa-hand-scissors"></i>
            </button>
        </div>

        <div class="msg-container">
            <p id="msg">Play your move!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
